# Web browser caches and profiles.
# Chromium browsers keep one folder per profile under User Data (Default, Profile 1, ...).

- id: browsers-chrome-cache
  match: '%LOCALAPPDATA%\Google\Chrome\User Data\*\Cache'
  name: Chrome cache
  owner: Google Chrome
  description: Images, scripts and other files Chrome saved from websites so pages load faster. Chrome downloads them again as needed. Close Chrome before removing it.
  safety: rebuilds
  tests:
    match: ['%LOCALAPPDATA%\Google\Chrome\User Data\Default\Cache', '%LOCALAPPDATA%\Google\Chrome\User Data\Profile 1\Cache']
    no_match: ['%LOCALAPPDATA%\Google\Chrome\User Data\Default\Cache\Cache_Data', '%LOCALAPPDATA%\Google\Chrome\User Data\Cache', '%LOCALAPPDATA%\Google\Chrome\User Data\Default\Media Cache']

- id: browsers-chrome-code-cache
  match: '%LOCALAPPDATA%\Google\Chrome\User Data\*\Code Cache'
  name: Chrome code cache
  owner: Google Chrome
  description: Compiled JavaScript that Chrome keeps so websites start faster. Chrome recreates it as you browse.
  safety: rebuilds
  tests:
    match: ['%LOCALAPPDATA%\Google\Chrome\User Data\Default\Code Cache']
    no_match: ['%LOCALAPPDATA%\Google\Chrome\User Data\Default\Code Cache\js', '%LOCALAPPDATA%\Google\Chrome\User Data\Default\Cache']

- id: browsers-chrome-gpu-cache
  match: '%LOCALAPPDATA%\Google\Chrome\User Data\*\GPUCache'
  name: Chrome GPU cache
  owner: Google Chrome
  description: Compiled graphics shaders Chrome uses to draw pages. It is small and Chrome recreates it.
  safety: rebuilds
  tests:
    match: ['%LOCALAPPDATA%\Google\Chrome\User Data\Default\GPUCache']
    no_match: ['%LOCALAPPDATA%\Google\Chrome\User Data\Default\GPUCache\data_1', '%LOCALAPPDATA%\Google\Chrome\User Data\GPUCache']

- id: browsers-chrome-service-worker-cache
  match: '%LOCALAPPDATA%\Google\Chrome\User Data\*\Service Worker\CacheStorage'
  name: Chrome site storage cache
  owner: Google Chrome
  description: Files websites stored for offline use and faster loading. Sites download them again, but web apps that work offline lose their offline content until you visit them again.
  safety: rebuilds
  tests:
    match: ['%LOCALAPPDATA%\Google\Chrome\User Data\Default\Service Worker\CacheStorage']
    no_match: ['%LOCALAPPDATA%\Google\Chrome\User Data\Default\Service Worker\CacheStorage\abc', '%LOCALAPPDATA%\Google\Chrome\User Data\Default\Service Worker\Database']

- id: browsers-chrome-profile
  match: '%LOCALAPPDATA%\Google\Chrome\User Data'
  name: Chrome profiles
  owner: Google Chrome
  description: Your Chrome profiles, with bookmarks, saved passwords, history, extensions and settings. Deleting it loses anything not synced to your Google account. Clear browsing data from Chrome's settings instead.
  safety: never
  tests:
    match: ['%LOCALAPPDATA%\Google\Chrome\User Data']
    no_match: ['%LOCALAPPDATA%\Google\Chrome\User Data\Default', '%LOCALAPPDATA%\Microsoft\Edge\User Data']

- id: browsers-edge-cache
