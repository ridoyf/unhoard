- id: browsers-edge-service-worker-cache
  match: '%LOCALAPPDATA%\Microsoft\Edge\User Data\*\Service Worker\CacheStorage'
  name: Edge site storage cache
  owner: Microsoft Edge
  description: Files websites stored for offline use and faster loading. Sites download them again, but web apps that work offline lose their offline content until you visit them again.
  safety: rebuilds
  tests:
    match: ['%LOCALAPPDATA%\Microsoft\Edge\User Data\Default\Service Worker\CacheStorage']
    no_match: ['%LOCALAPPDATA%\Microsoft\Edge\User Data\Default\Service Worker\CacheStorage\abc', '%LOCALAPPDATA%\Microsoft\Edge\User Data\Default\Service Worker']

- id: browsers-edge-profile
  match: '%LOCALAPPDATA%\Microsoft\Edge\User Data'
  name: Edge profiles
  owner: Microsoft Edge
  description: Your Edge profiles, with favourites, saved passwords, history, extensions and settings. Deleting it loses anything not synced to your Microsoft account. Clear browsing data from Edge's settings instead.
  safety: never
  tests:
    match: ['%LOCALAPPDATA%\Microsoft\Edge\User Data']
    no_match: ['%LOCALAPPDATA%\Microsoft\Edge\User Data\Default', '%LOCALAPPDATA%\Google\Chrome\User Data']

