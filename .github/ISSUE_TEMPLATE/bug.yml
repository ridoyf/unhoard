name: Bug report
description: Something did not work, or did the wrong thing
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Unhoard version
      description: Shown at the bottom of Settings.
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: dropdown
    id: admin
    attributes:
      label: Running as administrator?
      options:
        - "No"
        - "Yes"
        - Not sure
  - type: textarea
    id: log
    attributes:
      label: Log
      description: For a crash or a failed action, the end of %LOCALAPPDATA%\Unhoard\logs\unhoard.log. Paths in it can include your user name.
      render: text
