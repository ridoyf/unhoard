name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install tools
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - name: Test
        run: |
          wails3 generate bindings -ts -i
          (cd frontend && npm ci && npm run check && npm run build)
          go vet ./...
          go test ./...

      # File details need a plain number, so v1.2.0-beta becomes 1.2.0.
      - name: Set the version shown in file details
        run: |
          v="${GITHUB_REF_NAME#v}"
          v="${v%%-*}"
          sed -i -E "s/(\"(file_version|ProductVersion)\": )\"[^\"]*\"/\1\"$v\"/" build/windows/info.json
          sed -i -E "s/(!define INFO_PRODUCTVERSION )\"[^\"]*\"/\1\"$v\"/" build/windows/nsis/wails_tools.nsh
          grep -n "\"$v\"" build/windows/info.json build/windows/nsis/wails_tools.nsh

      - name: Build installer
        run: wails3 package VERSION=${{ github.ref_name }}

      - name: Checksums
        run: cd bin && sha256sum unhoard-amd64-installer.exe unhoard.exe | tee SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            bin/unhoard-amd64-installer.exe
            bin/unhoard.exe

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Download `unhoard-amd64-installer.exe` to install Unhoard, or `unhoard.exe` to run it without installing. It needs Windows 10 or 11 (x64).

          Both files were built by GitHub Actions from this tag ([build log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})). To check that a download is the file built here, run:

          ```
          gh attestation verify unhoard-amd64-installer.exe --repo ${{ github.repository }}
          ```

          SHA-256 checksums are in `SHA256SUMS.txt`.
          EOF
          gh release create "${{ github.ref_name }}" bin/unhoard-amd64-installer.exe bin/unhoard.exe bin/SHA256SUMS.txt \
            --title "Unhoard ${{ github.ref_name }}" --notes-file notes.md --generate-notes --draft
